name: LOOKFIT v0.1 Android APK

on:
  push:
    branches:
      - lookfit-v0.1
    paths:
      - 'LOOKFIT/**'
      - '.github/workflows/lookfit-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Compile release APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: LOOKFIT
    steps:
      - name: Checkout LOOKFIT
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project
        run: |
          flutter create . --platforms=android --org com.lookfit --project-name lookfit --no-pub
          python3 - <<'PY'
          from pathlib import Path
          p=Path("android/app/src/main/AndroidManifest.xml")
          s=p.read_text()
          s=s.replace('android:label="lookfit"', 'android:label="LOOKFIT"')
          p.write_text(s)
          PY

      - name: Dependencies
        run: flutter pub get

      - name: Validate Dart
        run: dart analyze lib

      - name: Build Android APK
        run: flutter build apk --release

      - name: Ensure installable APK is present
        run: |
          test -s build/app/outputs/flutter-apk/app-release.apk
          ls -lh build/app/outputs/flutter-apk/app-release.apk
          sha256sum build/app/outputs/flutter-apk/app-release.apk

      - name: Publish Android installer
        uses: actions/upload-artifact@v4
        with:
          name: LOOKFIT-v0.1-APK
          path: LOOKFIT/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
